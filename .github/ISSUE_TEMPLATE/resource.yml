# Generated by scripts/check/catalog.js
name: 添加或更新 Rust 资源
description: 提交资源的完整信息，供维护者审核后通过 PR 更新目录。
title: "[资源] "
body:
  - type: markdown
    attributes:
      value: 请先搜索资源目录，避免重复提交。当前由维护者根据 Issue 提交 PR；自动生成 PR 将在后续接入。
  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options:
        - add
        - update
    validations:
      required: true
  - type: input
    id: resource_id
    attributes:
      label: 资源 ID
      description: 新增时填写唯一小写英文 ID，例如 tokio-guide；更新时复制目录中的现有 ID。
    validations:
      required: true
  - type: input
    id: resource_title
    attributes:
      label: 资源名称
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - learning/articles
        - learning/videos
        - learning/books
        - tools/ide
        - tools/cargo
        - tools/frontend
        - libraries/gui
        - libraries/tui
        - libraries/cli
        - libraries/game
        - libraries/async
        - libraries/frontend
        - libraries/wasm
        - libraries/network
        - libraries/web
        - libraries/serialization
        - libraries/messaging
        - libraries/config
        - libraries/datetime
        - libraries/encoding
        - libraries/security
        - libraries/database
        - libraries/testing
        - libraries/geometry
        - libraries/image
        - libraries/audio
        - libraries/video
        - libraries/documents
        - libraries/data
        - libraries/ast
        - libraries/automation
        - libraries/system
        - libraries/ml
        - libraries/ffi
        - libraries/graphics
        - libraries/rpc
        - libraries/multimedia
        - libraries/utilities
        - libraries/blockchain
        - applications/tunnels
        - applications/observability
        - applications/editors
        - applications/productivity
        - applications/terminal
        - applications/remote
        - applications/git
        - applications/analysis
        - applications/database
        - applications/os
        - applications/compiler
        - applications/search
        - applications/system
        - applications/video
        - applications/translation
        - community/forums
        - community/news
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 主链接
      description: 填写官网、文档或代码仓库的 HTTP(S) 链接。
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: 维护状态
      options:
        - unknown
        - active
        - archived
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: 资源介绍
      description: 填写完整的新版本介绍（Markdown），包含用途、适用场景和补充链接；不需要一级标题。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 收录或更新依据
      description: 说明推荐理由、更新点；标记 active/archived 时附核验日期与证据。
    validations:
      required: true
